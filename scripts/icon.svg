<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0b172e"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Glowing Cyan/Azure Wing Gradient -->
    <linearGradient id="wing-primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <linearGradient id="wing-secondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="wing-tertiary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Envelope Stroke Gradient -->
    <linearGradient id="envelope-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="envelope-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b38" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#081124" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Speed Lines Gradient -->
    <linearGradient id="speed-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="1"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)"/>
  <rect width="128" height="128" rx="28" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

  <!-- Radial Ambience Glow behind envelope and wing -->
  <circle cx="68" cy="62" r="38" fill="#00d4ff" opacity="0.12"/>
  <circle cx="92" cy="46" r="24" fill="#38bdf8" opacity="0.16"/>

  <!-- Horizontal Speed Velocity Lines behind envelope -->
  <line x1="42" y1="36" x2="68" y2="36" stroke="url(#speed-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="68" y1="68" x2="94" y2="68" stroke="url(#speed-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="72" y1="74" x2="88" y2="74" stroke="url(#speed-grad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="38" y1="84" x2="70" y2="84" stroke="url(#speed-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Main Envelope Body -->
  <!-- Back / Inner Fill -->
  <rect x="24" y="44" width="52" height="38" rx="5" fill="url(#envelope-fill)"/>
  
  <!-- Outer Glow Stroke for Envelope -->
  <rect x="24" y="44" width="52" height="38" rx="5" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>

  <!-- Envelope Lower Flap Crease -->
  <path d="M 24 82 L 48 60 M 76 82 L 56 62" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Envelope Front V-Flap (Seamlessly connecting towards the wing) -->
  <path d="M 24 45 L 50 67 L 68 53" fill="none" stroke="url(#envelope-glow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Aerodynamic Falcon Wing Layer 3 (Lowest feather) -->
  <path d="M 54 64 C 62 64, 76 68, 92 60 C 84 66, 72 70, 56 70 Z" fill="url(#wing-tertiary)"/>

  <!-- Aerodynamic Falcon Wing Layer 2 (Middle feather) -->
  <path d="M 50 67 C 62 63, 80 56, 102 44 C 92 53, 76 62, 52 69 Z" fill="url(#wing-secondary)"/>

  <!-- Aerodynamic Falcon Wing Layer 1 (Top leading primary feather - sweeping high) -->
  <path d="M 48 66 C 58 58, 72 40, 96 24 C 90 36, 80 48, 52 66 Z" fill="url(#wing-primary)"/>

  <!-- Extra Top Wing Tip Accent / Highlight -->
  <path d="M 68 45 C 80 34, 90 28, 96 24 C 94 30, 84 40, 72 48 Z" fill="#ffffff" opacity="0.75"/>

  <!-- Glowing V-Core Checkmark Fold Highlight -->
  <path d="M 38 56 L 50 67 L 78 44" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
